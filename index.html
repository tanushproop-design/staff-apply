<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NexafyreZ Staff Apply</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: linear-gradient(135deg, #050505, #141414);
        color: white;
        font-family: "Segoe UI", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        max-width: 480px;
        width: 90%;
        margin: 60px auto;
        padding: 25px;
        background: #0f0f0f;
        border-radius: 15px;
        box-shadow: 0 0 25px red;
        border: 1px solid rgba(255, 0, 0, 0.2);
      }
      h1 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 5px;
        color: #ff4444;
      }
      p {
        text-align: center;
        color: #aaa;
        margin-bottom: 20px;
        font-size: 14px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #333;
        border-radius: 8px;
        background: #1a1a1a;
        color: white;
        font-size: 14px;
        outline: none;
        transition: border 0.3s;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: red;
        box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
      }
      textarea {
        min-height: 80px;
        resize: vertical;
      }
      select {
        cursor: pointer;
      }
      select option {
        background: #1a1a1a;
        color: white;
      }
      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #cc0000, #ff3333);
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
      }
      button:hover {
        background: linear-gradient(135deg, #ff3333, #ff5555);
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        transform: translateY(-2px);
      }
      button:disabled {
        background: #333;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      .success {
        color: #00ff88;
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
      }
      .error {
        color: #ff4444;
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
      }
      .footer {
        text-align: center;
        margin-top: 20px;
        color: #555;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>NexafyreZ Staff Application</h1>
      <p>Fill the form to apply for staff</p>
      <form id="staffForm">
        <input type="text" name="name" placeholder="Your Name" required />
        <input
          type="text"
          name="discord"
          placeholder="Discord Username"
          required
        />
        <input type="number" name="age" placeholder="Your Age" required />
        <select name="role" required>
          <option value="">Select Role</option>
          <option>Staff</option>
          <option>Helper</option>
        </select>
        <textarea
          name="experience"
          placeholder="Your Experience"
          required
        ></textarea>
        <textarea
          name="reason"
          placeholder="Why should we select you?"
          required
        ></textarea>
        <button type="submit">Submit Application</button>
      </form>
      <div id="msg"></div>
      <div class="footer">© 2026 Proof Bot | Staff Application</div>
    </div>

    <script>
      // ⚡ PASTE YOUR DISCORD WEBHOOK URL HERE ⚡
      // Run >setupapply #channel in Discord to get the webhook URL
      const WEBHOOK_URL = "https://discord.com/api/webhooks/1479944667519914005/IcdjtFImTHEbOxUXzI4syi1Zbn96F07TrcFN9MauZFjzJUyCn9d4TUVvpzey_Fmkbqqg";

      document
        .getElementById("staffForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const btn = this.querySelector("button");
          btn.disabled = true;
          btn.textContent = "Sending...";

          const name = this.name.value;
          const discord = this.discord.value;
          const age = this.age.value;
          const role = this.role.value;
          const experience = this.experience.value;
          const reason = this.reason.value;

          const embed = {
            title: "📋 New Staff Application",
            color: 0xff0000,
            fields: [
              { name: "👤 Name", value: name, inline: true },
              { name: "🎮 Discord", value: discord, inline: true },
              { name: "📅 Age", value: age, inline: true },
              { name: "🎭 Role Applied", value: role, inline: true },
              { name: "📝 Experience", value: experience || "Not provided", inline: false },
              { name: "❓ Why Select", value: reason || "Not provided", inline: false }
            ],
            footer: { text: "Proof Bot | Staff Apply System" },
            timestamp: new Date().toISOString()
          };

          fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: "Proof Staff Apply",
              avatar_url: "https://cdn.discordapp.com/embed/avatars/0.png",
              embeds: [embed]
            })
          })
            .then(function (res) {
              if (res.ok) {
                document.getElementById("msg").innerHTML =
                  "<div class='success'>✅ Application sent successfully!</div>";
                document.getElementById("staffForm").reset();
              } else {
                document.getElementById("msg").innerHTML =
                  "<div class='error'>❌ Error sending application. Try again.</div>";
              }
            })
            .catch(function () {
              document.getElementById("msg").innerHTML =
                "<div class='error'>❌ Network error. Try again.</div>";
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = "Submit Application";
            });
        });
    </script>
  </body>
</html>
